name: Ingest dataset issues

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'dataset')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract fields
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue
            const body = issue.body || ''
            const fields = new Map()
            for (const section of body.split(/^### /m).slice(1)) {
              const newline = section.indexOf('\n')
              if (newline === -1) continue
              fields.set(section.slice(0, newline).trim(), section.slice(newline + 1).trim())
            }
            const getField = label => fields.get(label) || ''
            const links = getField('Data URL(s)')
              .split(/\s+/)
              .filter(link => /^https:\/\//i.test(link))
            const rec = {
              id: issue.number,
              status: 'approved',
              name: getField('Dataset name') || issue.title.replace(/^Dataset:\s*/,'').trim(),
              description: getField('Description'),
              links,
              size: getField('Size'),
              tags: getField('Tags').split(/[,\s]+/).filter(Boolean),
              license_url: getField('License or usage terms URL'),
              attribution: getField('Preferred citation or attribution'),
              source_issue: issue.html_url,
              submitted_by: issue.user && issue.user.login
            }
            if (!rec.name || !rec.description || !rec.links.length ||
                !/^https:\/\//i.test(rec.license_url) || !rec.attribution) {
              core.setFailed('Name, description, an HTTPS data URL, HTTPS usage-terms URL, and attribution are required.')
              return
            }
            core.setOutput('record', JSON.stringify(rec))

      - name: Update datasets.json
        id: update
        run: |
          node -e "
          const fs = require('fs');
          const path = 'public/datasets.json';
          const rec = JSON.parse(process.env.REC);
          let arr = [];
          if (fs.existsSync(path)) {
            arr = JSON.parse(fs.readFileSync(path, 'utf8'));
          }
          const idx = arr.findIndex(x => x.id === rec.id);
          if (idx >= 0) arr[idx] = rec; else arr.unshift(rec);
          fs.writeFileSync(path, JSON.stringify(arr, null, 2));
          "
        env:
          REC: ${{ steps.extract.outputs.record }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(datasets): ingest #${{ github.event.issue.number }}"
          title: "Ingest dataset #${{ github.event.issue.number }}"
          body: "Automated update of public/datasets.json from dataset issue."
          branch: "ingest/dataset-${{ github.event.issue.number }}"
          base: ${{ github.event.repository.default_branch }}
